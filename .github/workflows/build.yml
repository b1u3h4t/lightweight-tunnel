name: CI

# 运行器策略：
#   - pull_request（可能来自 fork）→ GitHub 托管 runner，绝不落到自托管机器
#   - push / workflow_dispatch / tag（可信触发）→ nc3 自托管 runner（标签 nc3）
#   - arm64 / macOS 产物仍用 GitHub 托管原生 runner（nc3 是 x86_64）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'nc3' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install libpcap (GitHub-hosted only)
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race -count=1 ./...

  build-linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            runner_self: nc3
            suffix: linux-amd64
          - runner: ubuntu-24.04-arm
            runner_self: ubuntu-24.04-arm
            suffix: linux-arm64

    runs-on: ${{ github.event_name == 'pull_request' && matrix.runner || matrix.runner_self }}
    steps:
      - uses: actions/checkout@v4

      - name: Install libpcap (GitHub-hosted only)
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        env:
          CGO_ENABLED: '1'
        run: |
          go build -v -ldflags="-s -w -X main.version=${{ github.sha }}" \
            -o lightweight-tunnel-${{ matrix.suffix }} ./cmd/lightweight-tunnel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-tunnel-${{ matrix.suffix }}
          path: lightweight-tunnel-${{ matrix.suffix }}

  build-macos:
    needs: test
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            suffix: macos-amd64
          - goarch: arm64
            suffix: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        env:
          CGO_ENABLED: '1'
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -v -ldflags="-s -w -X main.version=${{ github.sha }}" \
            -o lightweight-tunnel-${{ matrix.suffix }} ./cmd/lightweight-tunnel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-tunnel-${{ matrix.suffix }}
          path: lightweight-tunnel-${{ matrix.suffix }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -race -count=1 ./...

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            suffix: linux-amd64
            cc: gcc
            pkg: ""
          - goarch: arm64
            suffix: linux-arm64
            cc: aarch64-linux-gnu-gcc
            pkg: "gcc-aarch64-linux-gnu libpcap-dev:arm64"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install cross-compile deps
        run: |
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            sudo dpkg --add-architecture arm64
            # Add arm64 sources
            sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list.d/*.list 2>/dev/null || true
            echo "deb [arch=arm64] http://ports.ubuntu.com/ $(lsb_release -cs) main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          fi
          sudo apt-get update
          sudo apt-get install -y libpcap-dev ${{ matrix.pkg }}

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '1'
          CC: ${{ matrix.cc }}
        run: |
          go build -v -ldflags="-s -w -X main.version=${{ github.sha }}" \
            -o lightweight-tunnel-${{ matrix.suffix }} ./cmd/lightweight-tunnel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-tunnel-${{ matrix.suffix }}
          path: lightweight-tunnel-${{ matrix.suffix }}

  build-macos:
    needs: test
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - goarch: amd64
            suffix: macos-amd64
          - goarch: arm64
            suffix: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        env:
          CGO_ENABLED: '1'
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -v -ldflags="-s -w -X main.version=${{ github.sha }}" \
            -o lightweight-tunnel-${{ matrix.suffix }} ./cmd/lightweight-tunnel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-tunnel-${{ matrix.suffix }}
          path: lightweight-tunnel-${{ matrix.suffix }}

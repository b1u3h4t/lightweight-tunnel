services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lt-server
    privileged: true
    volumes:
      - ./docker-test/server.json:/etc/lightweight-tunnel/config.json:ro
    command: ["-c", "/etc/lightweight-tunnel/config.json"]
    networks:
      tunnel-net:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD", "ip", "link", "show", "tun0"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s

  client1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lt-client1
    privileged: true
    volumes:
      - ./docker-test/client.json:/etc/lightweight-tunnel/config.json:ro
    command: ["-c", "/etc/lightweight-tunnel/config.json"]
    depends_on:
      server:
        condition: service_healthy
    networks:
      tunnel-net:
        ipv4_address: 172.30.0.20
    healthcheck:
      test: ["CMD-SHELL", "ping -c 1 -W 2 10.99.0.1 >/dev/null 2>&1"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s

  client2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lt-client2
    privileged: true
    volumes:
      - ./docker-test/client2.json:/etc/lightweight-tunnel/config.json:ro
    command: ["-c", "/etc/lightweight-tunnel/config.json"]
    depends_on:
      server:
        condition: service_healthy
    networks:
      tunnel-net:
        ipv4_address: 172.30.0.21
    healthcheck:
      test: ["CMD-SHELL", "ping -c 1 -W 2 10.99.0.1 >/dev/null 2>&1"]
      interval: 3s
      timeout: 2s
      retries: 20
      start_period: 5s

  tester:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lt-tester
    network_mode: "service:client1"
    depends_on:
      client1:
        condition: service_healthy
      client2:
        condition: service_healthy
    volumes:
      - ./docker-test/test.sh:/test.sh:ro
    entrypoint: ["bash", "/test.sh"]

  server-nc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lt-server-nc
    network_mode: "service:server"
    depends_on:
      server:
        condition: service_healthy
    entrypoint:
      - bash
      - -lc
      - |
        while true; do
          printf 'server-tunnel-ok\n' | nc -l -p 18080 -q 1;
        done

  client2-nc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lt-client2-nc
    network_mode: "service:client2"
    depends_on:
      client2:
        condition: service_healthy
    entrypoint:
      - bash
      - -lc
      - |
        while true; do
          printf 'client2-tunnel-ok\n' | nc -l -p 18081 -q 1;
        done

networks:
  tunnel-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
